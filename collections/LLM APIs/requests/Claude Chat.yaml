name: Claude Chat
method: POST
url: '{{anthropic_base_url}}/messages'
headers:
  x-api-key: '{{anthropic_api_key}}'
  anthropic-version: '2023-06-01'
  content-type: application/json
body:
  type: json
  content:
    model: '{{model}}'
    max_tokens: 4096
    messages:
    - role: user
      content: '{{prompt}}'
