name: Quick Prompt
method: POST
url: https://api.openai.com/v1/chat/completions
headers:
  Content-Type: application/json
  Authorization: Bearer {{OPENAI_API_KEY}}
body:
  type: json
  content:
    model: '{{GPT_MODEL}}'
    messages:
    - role: user
      content: '{{GPT_PROMPT}}'
    max_completion_tokens: 4096
