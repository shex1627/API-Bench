name: Create Message - With System Prompt
method: POST
url: https://api.anthropic.com/v1/messages
headers:
  Content-Type: application/json
  anthropic-version: '2023-06-01'
  x-api-key: '{{ANTHROPIC_API_KEY}}'
body:
  type: json
  content:
    max_tokens: 2048
    messages:
    - content: You are a helpful coding assistant.
      role: user
    - content: Understood! I'm ready to help with coding questions.
      role: assistant
    - content: Write a Python function to reverse a string
      role: user
    model: claude-sonnet-4-20250514
    system: You are a senior software engineer. Provide clean, well-commented code.
